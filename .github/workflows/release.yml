name: Build & Release Windows Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go unit tests
        run: go test -v ./...

      - name: Build Windows executable with Wails
        run: wails build -platform windows/amd64 -s

      - name: Package release artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $exeSrc = "build\bin\ssh-packet-capture.exe"
          $exeDst = "release\NetProbe-$tag-windows-amd64.exe"
          $zipDst = "release\NetProbe-$tag-windows-amd64.zip"

          Copy-Item $exeSrc $exeDst
          Compress-Archive -Path $exeDst, "README.md" -DestinationPath $zipDst -Force

          $hashes = Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath "release\SHA256SUMS.txt" -Encoding utf8

          Get-ChildItem release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetProbe-windows-amd64
          path: release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
